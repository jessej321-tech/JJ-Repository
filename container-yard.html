<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Port Terminal</title>
<style>
  :root {
    --bg: #1a1f2e;
    --panel: #232a3d;
    --asphalt: #2d3447;
    --line: #f5d547;
    --text: #e6e9f0;
    --muted: #8a92a6;
    --import: #3a86ff;
    --export: #2ec4b6;
    --empty: #adb5bd;
    --reefer: #ff006e;
    --hazmat: #ff9f1c;
    --hull: #0d1220;
    /* Pick-day colors taken directly from the spreadsheet */
    --day-mon:  #ff33cc;
    --day-tue:  #0099cc;
    --day-wed:  #ffff00;
    --day-insp: #00b050;
    --day-vacis:#ff0000;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }

  h1 { margin: 0; font-size: 22px; font-weight: 600; }

  .stats {
    display: flex;
    gap: 24px;
    font-size: 13px;
    color: var(--muted);
  }
  .stats strong { color: var(--text); font-size: 16px; display: block; }

  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 16px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .tab {
    padding: 10px 18px;
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
  }
  .tab:hover { color: var(--text); }
  .tab.active {
    color: var(--line);
    border-bottom-color: var(--line);
  }

  .panel { display: none; }
  .panel.active { display: block; }

  /* ---------- Yard ---------- */
  .yard {
    background: var(--asphalt);
    border-radius: 8px;
    padding: 24px;
    background-image:
      repeating-linear-gradient(90deg, transparent, transparent 60px, rgba(245,213,71,0.08) 60px, rgba(245,213,71,0.08) 62px);
  }

  .row {
    display: flex;
    align-items: center;
    margin-bottom: 18px;
    gap: 12px;
  }

  .row-label {
    width: 40px;
    font-weight: 600;
    color: var(--line);
    font-size: 18px;
    text-align: center;
  }

  .bays { display: flex; gap: 8px; flex: 1; }

  .bay {
    display: flex;
    flex-direction: column-reverse;
    gap: 2px;
    background: rgba(0,0,0,0.2);
    padding: 4px;
    border-radius: 4px;
    min-width: 70px;
  }

  .container {
    height: 22px;
    border-radius: 2px;
    font-size: 10px;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s;
    box-shadow: inset 0 -2px 0 rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.15);
  }
  .container:hover { transform: scale(1.08); z-index: 1; }
  .container.empty-slot {
    background: transparent;
    border: 1px dashed rgba(255,255,255,0.15);
    box-shadow: none;
    cursor: default;
  }
  .container.import { background: var(--import); }
  .container.export { background: var(--export); }
  .container.empty  { background: var(--empty); color: #333; }
  .container.reefer { background: var(--reefer); }
  .container.hazmat { background: var(--hazmat); color: #333; }

  .bay-label {
    font-size: 10px;
    color: var(--muted);
    text-align: center;
    margin-top: 4px;
  }

  .legend {
    display: flex;
    gap: 20px;
    margin-top: 20px;
    padding: 14px 18px;
    background: var(--panel);
    border-radius: 6px;
    font-size: 13px;
    flex-wrap: wrap;
  }
  .legend-item { display: flex; align-items: center; gap: 8px; }
  .swatch {
    width: 16px; height: 16px; border-radius: 3px;
    box-shadow: inset 0 -2px 0 rgba(0,0,0,0.25);
  }

  .tooltip {
    position: fixed;
    background: #000;
    color: white;
    padding: 6px 10px;
    border-radius: 4px;
    font-size: 12px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.1s;
    z-index: 100;
    white-space: nowrap;
  }

  /* ---------- Vessel Bay Plan (faithful to spreadsheet) ---------- */
  .bp-meta {
    display: grid;
    grid-template-columns: auto 1fr auto 1fr auto 120px;
    gap: 10px 14px;
    align-items: center;
    padding: 14px 18px;
    background: var(--panel);
    border-radius: 6px;
    margin-bottom: 16px;
    font-size: 13px;
  }
  .bp-meta label { color: var(--muted); font-weight: 600; }
  .bp-meta input {
    background: var(--bg);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--text);
    padding: 6px 10px;
    border-radius: 4px;
    font-size: 13px;
    width: 100%;
  }

  .bp-legend {
    display: flex;
    gap: 14px;
    padding: 12px 18px;
    background: var(--panel);
    border-radius: 6px;
    margin-bottom: 16px;
    font-size: 12px;
    flex-wrap: wrap;
    align-items: center;
  }
  .bp-legend .hint { color: var(--muted); margin-left: auto; font-style: italic; }
  .day-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 4px;
    font-weight: 700;
    color: #111;
    cursor: pointer;
    border: 2px solid transparent;
    user-select: none;
  }
  .day-chip.active { border-color: var(--line); box-shadow: 0 0 0 2px rgba(245,213,71,0.25); }
  .day-chip[data-day="mon"]   { background: var(--day-mon);   color: #fff; }
  .day-chip[data-day="tue"]   { background: var(--day-tue);   color: #fff; }
  .day-chip[data-day="wed"]   { background: var(--day-wed);   color: #111; }
  .day-chip[data-day="insp"]  { background: var(--day-insp);  color: #fff; }
  .day-chip[data-day="vacis"] { background: var(--day-vacis); color: #fff; }
  .day-chip[data-day="clear"] { background: transparent; color: var(--muted); border: 1px solid rgba(255,255,255,0.15); }

  .bay-block {
    background: var(--hull);
    border-radius: 8px;
    padding: 16px 20px;
    margin-bottom: 18px;
    overflow-x: auto;
  }
  .bay-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--line);
    margin-bottom: 10px;
    text-align: center;
    letter-spacing: 0.5px;
  }
  .bp-grid {
    display: inline-grid;
    gap: 2px;
    margin: 0 auto;
  }
  .bp-cell {
    width: 70px;
    height: 26px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 2px;
    font-size: 10px;
    color: var(--text);
    text-align: center;
    padding: 2px 4px;
    outline: none;
    font-family: inherit;
  }
  .bp-cell:focus {
    border-color: var(--line);
    background: rgba(245,213,71,0.08);
  }
  .bp-cell.header-tier,
  .bp-cell.header-row {
    background: transparent;
    border: none;
    color: var(--muted);
    font-weight: 700;
    font-size: 11px;
    cursor: default;
    pointer-events: none;
  }
  .bp-cell.center-col {
    border-left: 2px solid rgba(245,213,71,0.35);
  }
  .bp-cell.day-mon   { background: var(--day-mon);   color: #fff; }
  .bp-cell.day-tue   { background: var(--day-tue);   color: #fff; }
  .bp-cell.day-wed   { background: var(--day-wed);   color: #111; }
  .bp-cell.day-insp  { background: var(--day-insp);  color: #fff; }
  .bp-cell.day-vacis { background: var(--day-vacis); color: #fff; }

  .bp-tally {
    display: flex;
    gap: 14px;
    justify-content: flex-end;
    font-size: 11px;
    color: var(--muted);
    margin-top: 6px;
  }
  .bp-tally span strong { color: var(--text); }
</style>
</head>
<body>
  <header>
    <h1>Port Terminal</h1>
    <div class="stats" id="stats-bar">
      <div><strong id="stat-total">0</strong>Total TEU</div>
      <div><strong id="stat-import">0</strong>Import</div>
      <div><strong id="stat-export">0</strong>Export</div>
      <div><strong id="stat-empty">0</strong>Empty</div>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="yard">Container Yard</button>
    <button class="tab" data-tab="bayplan">Bay Plan for Picks</button>
  </nav>

  <!-- ===== Yard Tab ===== -->
  <section class="panel active" id="panel-yard">
    <div class="yard" id="yard"></div>
    <div class="legend">
      <div class="legend-item"><span class="swatch" style="background:var(--import)"></span>Import</div>
      <div class="legend-item"><span class="swatch" style="background:var(--export)"></span>Export</div>
      <div class="legend-item"><span class="swatch" style="background:var(--empty)"></span>Empty</div>
      <div class="legend-item"><span class="swatch" style="background:var(--reefer)"></span>Reefer</div>
      <div class="legend-item"><span class="swatch" style="background:var(--hazmat)"></span>Hazmat</div>
    </div>
  </section>

  <!-- ===== Bay Plan Tab ===== -->
  <section class="panel" id="panel-bayplan">
    <div class="bp-meta">
      <label for="bp-vessel">Vessel</label>
      <input id="bp-vessel" type="text" placeholder="Vessel name">
      <label for="bp-voyage">Voyage</label>
      <input id="bp-voyage" type="text" placeholder="Voyage number">
      <label for="bp-pct">%</label>
      <input id="bp-pct" type="text" placeholder="%">
    </div>

    <div class="bp-legend">
      <span style="color:var(--muted);font-weight:600">Tag:</span>
      <span class="day-chip active" data-day="mon">MONDAY</span>
      <span class="day-chip" data-day="tue">TUESDAY</span>
      <span class="day-chip" data-day="wed">WEDNESDAY</span>
      <span class="day-chip" data-day="insp">INSPECTIONS</span>
      <span class="day-chip" data-day="vacis">VACIS</span>
      <span class="day-chip" data-day="clear">CLEAR</span>
      <span class="hint">Pick a tag, then click cells to mark them. Type in cells to add container info.</span>
    </div>

    <div id="bp-bays"></div>
  </section>

  <div class="tooltip" id="tooltip"></div>

<script>
  /* ========= Tabs ========= */
  document.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
      document.getElementById('stats-bar').style.visibility =
        btn.dataset.tab === 'yard' ? 'visible' : 'hidden';
    });
  });

  /* ========= Container Yard ========= */
  const ROWS = ['A', 'B', 'C', 'D', 'E'];
  const BAYS_PER_ROW = 12;
  const MAX_STACK = 4;
  const TYPES = [
    { name: 'import', weight: 35 },
    { name: 'export', weight: 30 },
    { name: 'empty',  weight: 20 },
    { name: 'reefer', weight: 8  },
    { name: 'hazmat', weight: 7  },
  ];
  const totalWeight = TYPES.reduce((s, t) => s + t.weight, 0);
  function pickType() {
    let r = Math.random() * totalWeight;
    for (const t of TYPES) { if ((r -= t.weight) <= 0) return t.name; }
    return 'empty';
  }
  function makeId(row, bay, tier) {
    const seq = String(Math.floor(Math.random() * 9000) + 1000);
    return `${row}${String(bay).padStart(2,'0')}${tier} #${seq}`;
  }

  const counts = { total: 0, import: 0, export: 0, empty: 0, reefer: 0, hazmat: 0 };
  const yardEl = document.getElementById('yard');

  ROWS.forEach(row => {
    const rowEl = document.createElement('div');
    rowEl.className = 'row';
    rowEl.innerHTML = `<div class="row-label">${row}</div>`;
    const baysEl = document.createElement('div');
    baysEl.className = 'bays';
    for (let bay = 1; bay <= BAYS_PER_ROW; bay++) {
      const bayEl = document.createElement('div');
      bayEl.className = 'bay';
      const stackHeight = Math.floor(Math.random() * (MAX_STACK + 1));
      for (let tier = 1; tier <= MAX_STACK; tier++) {
        const slot = document.createElement('div');
        if (tier <= stackHeight) {
          const type = pickType();
          slot.className = `container ${type}`;
          const id = makeId(row, bay, tier);
          slot.textContent = type.charAt(0).toUpperCase();
          slot.dataset.tip = `${id} | ${type.toUpperCase()} | Tier ${tier}`;
          counts.total++;
          counts[type]++;
        } else {
          slot.className = 'container empty-slot';
        }
        bayEl.appendChild(slot);
      }
      const label = document.createElement('div');
      label.className = 'bay-label';
      label.textContent = String(bay).padStart(2, '0');
      bayEl.appendChild(label);
      baysEl.appendChild(bayEl);
    }
    rowEl.appendChild(baysEl);
    yardEl.appendChild(rowEl);
  });

  document.getElementById('stat-total').textContent = counts.total;
  document.getElementById('stat-import').textContent = counts.import;
  document.getElementById('stat-export').textContent = counts.export;
  document.getElementById('stat-empty').textContent = counts.empty;

  /* ========= Bay Plan (structure parsed from "Bay Plan for Picks.xlsx") ========= */
  const BAY_ROWS = ['10','08','06','04','02','00','01','03','05','07','09'];
  const BAY_PLAN = [
    { name: 'Bay 002 (OD)', tiers: ['86','84','82'] },
    { name: 'Bay 002 (BD)', tiers: ['16','14','12','10','08','06','04'] },
    { name: 'Bay 006 (OD)', tiers: ['86','84','82'] },
    { name: 'Bay 006 (BD)', tiers: ['16','14','12','10','08','06','04','02'] },
    { name: 'Bay 010 (BD)', tiers: ['22','20','18','16','14','12','10','08','06','04','02'] },
    { name: 'Bay 014 (BD)', tiers: ['22','20','18','16','14','12','10','08','06','04','02'] },
    { name: 'Bay 018 (BD)', tiers: ['22','20','18','16','14','12','10','08','06','04','02'] },
    { name: 'Bay 022 (BD)', tiers: ['22','20','18','16','14','12','10','08','06','04','02'] },
    { name: 'Bay 026 (BD)', tiers: ['20','18','16','14','12','10','08','06','04','02'] },
    { name: 'Bay 030 (BD)', tiers: ['20','18','16','14','12','10','08','06','04','02'] },
    { name: 'Bay 034 (BD)', tiers: ['22','20','18','16','14','12','10','08','06','04','02'] },
    { name: 'Bay 038 (BD)', tiers: ['22','20','18','16','14','12'] },
  ];

  const DAYS = ['mon','tue','wed','insp','vacis'];
  let activeTag = 'mon';

  document.querySelectorAll('.day-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.day-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      activeTag = chip.dataset.day;
    });
  });

  function tallyFor(block) {
    const tally = { mon:0, tue:0, wed:0, insp:0, vacis:0 };
    block.querySelectorAll('.bp-cell').forEach(c => {
      DAYS.forEach(d => { if (c.classList.contains('day-' + d)) tally[d]++; });
    });
    return tally;
  }
  function updateTally(block) {
    const t = tallyFor(block);
    const el = block.querySelector('.bp-tally');
    el.innerHTML = `
      <span>Mon <strong>${t.mon}</strong></span>
      <span>Tue <strong>${t.tue}</strong></span>
      <span>Wed <strong>${t.wed}</strong></span>
      <span>Insp <strong>${t.insp}</strong></span>
      <span>VACIS <strong>${t.vacis}</strong></span>
      <span>Total <strong>${t.mon+t.tue+t.wed+t.insp+t.vacis}</strong></span>
    `;
  }

  const baysHost = document.getElementById('bp-bays');
  BAY_PLAN.forEach(bay => {
    const block = document.createElement('div');
    block.className = 'bay-block';

    const title = document.createElement('div');
    title.className = 'bay-title';
    title.textContent = bay.name;
    block.appendChild(title);

    const grid = document.createElement('div');
    grid.className = 'bp-grid';
    grid.style.gridTemplateColumns = `48px repeat(${BAY_ROWS.length}, 70px)`;

    // header row: blank + row labels
    const blankTL = document.createElement('div');
    blankTL.className = 'bp-cell header-tier';
    grid.appendChild(blankTL);
    BAY_ROWS.forEach((r, i) => {
      const h = document.createElement('div');
      h.className = 'bp-cell header-row';
      if (r === '00') h.classList.add('center-col');
      h.textContent = r;
      grid.appendChild(h);
    });

    // body: tier label + cells
    bay.tiers.forEach(tier => {
      const tl = document.createElement('div');
      tl.className = 'bp-cell header-tier';
      tl.textContent = tier;
      grid.appendChild(tl);

      BAY_ROWS.forEach(rowLbl => {
        const cell = document.createElement('input');
        cell.type = 'text';
        cell.className = 'bp-cell';
        cell.dataset.bay = bay.name;
        cell.dataset.tier = tier;
        cell.dataset.row = rowLbl;
        if (rowLbl === '00') cell.classList.add('center-col');
        cell.addEventListener('click', e => {
          if (!activeTag) return;
          if (document.activeElement === cell && cell.value) return; // editing, don't toggle
        });
        cell.addEventListener('contextmenu', e => {
          e.preventDefault();
          DAYS.forEach(d => cell.classList.remove('day-' + d));
          updateTally(block);
        });
        cell.addEventListener('mousedown', e => {
          if (e.shiftKey || e.button === 1) {
            e.preventDefault();
            DAYS.forEach(d => cell.classList.remove('day-' + d));
            if (activeTag !== 'clear') cell.classList.add('day-' + activeTag);
            updateTally(block);
          }
        });
        cell.addEventListener('dblclick', () => {
          DAYS.forEach(d => cell.classList.remove('day-' + d));
          if (activeTag !== 'clear') cell.classList.add('day-' + activeTag);
          updateTally(block);
        });
        grid.appendChild(cell);
      });
    });

    block.appendChild(grid);

    const tally = document.createElement('div');
    tally.className = 'bp-tally';
    block.appendChild(tally);
    baysHost.appendChild(block);
    updateTally(block);
  });

  /* ========= Tooltip (yard only) ========= */
  const tip = document.getElementById('tooltip');
  document.addEventListener('mousemove', e => {
    const t = e.target;
    if (t.classList && t.classList.contains('container') && t.dataset.tip) {
      tip.textContent = t.dataset.tip;
      tip.style.left = (e.clientX + 12) + 'px';
      tip.style.top = (e.clientY + 12) + 'px';
      tip.style.opacity = '1';
    } else {
      tip.style.opacity = '0';
    }
  });
</script>
</body>
</html>
